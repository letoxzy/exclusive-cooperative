<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#075c3b" />
  <title>You are offline - Exclusive Cooperative</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f5f7fb; color: #172033; text-align: center;
    }
    main { max-width: 380px; }
    img { width: 84px; height: 84px; border-radius: 50%; }
    h1 { color: #075c3b; font-size: 24px; margin: 18px 0 8px; }
    p { color: #667085; line-height: 1.6; margin: 0 0 22px; }
    button {
      background: #075c3b; color: #fff; border: 0; border-radius: 10px;
      padding: 13px 26px; font-size: 15px; font-weight: 700; cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="Exclusive Cooperative" />
    <h1>You are offline</h1>
    <p>We could not reach the internet. Check your connection, then try again. Your savings and loan details are safe.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
